# Default values for skyops-agent
replicaCount: 1

image:
  repository: ghcr.io/skyops-software-solutions/skyops-agent
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion (v1.5.1)
  tag: "v1.5.1"

# SkyOps Central Platform Registration Settings
clusterId: ""
agentToken: ""
serverUrl: ""

nameOverride: ""
fullnameOverride: ""

nodeSelector: {}
tolerations: []
affinity: {}

resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop:
      - ALL

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

rbac:
  create: true
  # Permission Tier: "observer" | "operator" | "admin"
  # - observer: Read-only telemetry, logs, watches, and incident analysis. Zero mutation permissions.
  # - operator (default): Workload operations (Pod restart/delete, Deployment rollout/scale, StatefulSet scale, CronJobs/Jobs).
  # - admin: Platform operations including Node cordon, uncordon, and node drain via Eviction API.
  tier: "operator"

serviceAccount:
  create: true
  name: skyops-agent
  annotations: {}

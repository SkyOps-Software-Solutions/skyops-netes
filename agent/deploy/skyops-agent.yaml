---
apiVersion: v1
kind: Namespace
metadata:
  name: skyops-system
  labels:
    app.kubernetes.io/name: skyops-agent
    app.kubernetes.io/part-of: skyops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: skyops-agent
  namespace: skyops-system
  labels:
    app.kubernetes.io/name: skyops-agent

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: skyops-agent-operator
  labels:
    app.kubernetes.io/name: skyops-agent
    app.kubernetes.io/component: rbac
    skyops.io/permission-tier: "operator"
rules:
  # =========================================================================
  # 1. OBSERVABILITY & READ-ONLY DISCOVERY (All Tiers)
  # =========================================================================
  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch", "delete"] # "delete" enabled for Operator tier (Pod restart & deletion)
  - apiGroups: [""]
    resources:
      - pods/log
      - pods/status
      - nodes/status
      - namespaces
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
      - configmaps
      - secrets
      - serviceaccounts
      - resourcequotas
      - limitranges
      - events
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - nodes
    verbs: ["get", "list", "watch"]
  # Optional: For Platform Administrator tier (Node Cordon, Uncordon, Drain), uncomment:
  # - apiGroups: [""]
  #   resources: ["nodes"]
  #   verbs: ["get", "list", "watch", "patch", "update"]
  # - apiGroups: [""]
  #   resources: ["pods/eviction"]
  #   verbs: ["create"]

  # =========================================================================
  # 2. WORKLOAD MANAGEMENT (AppsV1 - Operator Tier)
  # =========================================================================
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources:
      - deployments/scale
      - statefulsets/scale
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources:
      - deployments/status
      - statefulsets/status
      - daemonsets/status
      - replicasets
    verbs: ["get", "list", "watch"]

  # =========================================================================
  # 3. BATCH WORKLOADS (BatchV1 - Operator Tier)
  # =========================================================================
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

  # =========================================================================
  # 4. CAPABILITY DISCOVERY, NETWORKING, STORAGE & METRICS
  # =========================================================================
  - apiGroups: ["authorization.k8s.io"]
    resources:
      - selfsubjectaccessreviews
    verbs: ["create"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - nodes
      - pods
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skyops-agent-operator-binding
  labels:
    app.kubernetes.io/name: skyops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: skyops-agent-operator
subjects:
  - kind: ServiceAccount
    name: skyops-agent
    namespace: skyops-system

---
apiVersion: v1
kind: Secret
metadata:
  name: skyops-agent-credentials
  namespace: skyops-system
  labels:
    app.kubernetes.io/name: skyops-agent
type: Opaque
stringData:
  SKYOPS_CLUSTER_ID: "YOUR_CLUSTER_ID_HERE"
  SKYOPS_AGENT_TOKEN: "YOUR_AGENT_TOKEN_HERE"
  SKYOPS_SERVER_URL: "https://skyops.acme.corp"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyops-agent
  namespace: skyops-system
  labels:
    app.kubernetes.io/name: skyops-agent
    app.kubernetes.io/version: "v1.5.1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skyops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyops-agent
    spec:
      serviceAccountName: skyops-agent
      terminationGracePeriodSeconds: 30
      containers:
        - name: skyops-agent
          image: ghcr.io/skyops-software-solutions/skyops-agent:v1.5.1
          imagePullPolicy: IfNotPresent
          env:
            - name: SKYOPS_CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: skyops-agent-credentials
                  key: SKYOPS_CLUSTER_ID
            - name: SKYOPS_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: skyops-agent-credentials
                  key: SKYOPS_AGENT_TOKEN
            - name: SKYOPS_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: skyops-agent-credentials
                  key: SKYOPS_SERVER_URL
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: spool
              mountPath: /var/spool/skyops-agent
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spool
          emptyDir: {}


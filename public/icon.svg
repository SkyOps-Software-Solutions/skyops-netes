<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#05070b"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2f7bff"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2f7bff" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(120, 160, 255, 0.16)" stroke-width="2"/>

  <!-- Orbital Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(47, 123, 255, 0.22)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Kubernetes Cluster Nodes (3 Hexagons) -->
  <!-- Top Node -->
  <polygon points="256,110 286,127 286,161 256,178 226,161 226,127" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="256" cy="144" r="6" fill="#38bdf8"/>

  <!-- Bottom Left Node -->
  <polygon points="144,320 174,337 174,371 144,388 114,371 114,337" fill="#0f172a" stroke="#2f7bff" stroke-width="3"/>
  <circle cx="144" cy="354" r="6" fill="#2f7bff"/>

  <!-- Bottom Right Node -->
  <polygon points="368,320 398,337 398,371 368,388 338,371 338,337" fill="#0f172a" stroke="#3ddc97" stroke-width="3"/>
  <circle cx="368" cy="354" r="6" fill="#3ddc97"/>

  <!-- Neural Telemetry Interconnect Lines -->
  <line x1="256" y1="178" x2="256" y2="230" stroke="rgba(56, 189, 248, 0.6)" stroke-width="2.5"/>
  <line x1="168" y1="326" x2="228" y2="280" stroke="rgba(47, 123, 255, 0.6)" stroke-width="2.5"/>
  <line x1="344" y1="326" x2="284" y2="280" stroke="rgba(61, 220, 151, 0.6)" stroke-width="2.5"/>

  <!-- Central Diamond Core (SkyOps Engine) -->
  <g filter="url(#shadow)">
    <!-- Rotated Square Diamond -->
    <rect x="216" y="216" width="80" height="80" rx="14" transform="rotate(45 256 256)" fill="url(#glow)"/>
    <!-- Inner Octahedron core -->
    <rect x="236" y="236" width="40" height="40" rx="8" transform="rotate(45 256 256)" fill="#ffffff"/>
  </g>
</svg>
